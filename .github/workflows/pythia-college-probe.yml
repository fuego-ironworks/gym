name: Probe Pythia college prior

on:
  push:
    branches:
      - pythia
    paths:
      - .github/workflows/pythia-college-probe.yml
      - llm/models/run_pythia_college_probe.py
      - llm/models/probes/college.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pythia

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU inference stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check \
            transformers==4.44.2

      - name: Run raw Pythia continuations
        shell: bash
        run: |
          set -euo pipefail
          python llm/models/run_pythia_college_probe.py

      - name: Commit receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gym pythia probe"
          git config user.email "gym-pythia-probe@users.noreply.github.com"
          git add llm/models/runs/pythia-410m-step143000-college.md
          if git diff --cached --quiet; then
            echo "Probe receipt unchanged"
            exit 0
          fi
          git commit -m "[pythia] Record college probe continuations"
          git pull --rebase origin pythia
          git push origin HEAD:pythia
