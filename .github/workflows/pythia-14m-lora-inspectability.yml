name: Pythia 14M LoRA inspectability

on:
  pull_request:
  workflow_dispatch:
    inputs:
      steps:
        description: Adjacent optimizer steps to retain after Test 0
        required: true
        default: "2"

permissions:
  contents: read

concurrency:
  group: pythia-14m-lora-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tensor-mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Gym
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --disable-pip-version-check \
            torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Test rank-one mechanics without a model download
        run: python -m unittest tests/test_rank_one_lora.py

  pythia-14m:
    needs: tensor-mechanics
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      GYM_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out Gym
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install CPU inference stack
        run: |
          python -m pip install --disable-pip-version-check \
            torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check \
            transformers==4.44.2 huggingface_hub==0.24.7

      - name: Run Test 0 and stepwise LoRA differential
        env:
          REQUESTED_STEPS: ${{ inputs.steps }}
        shell: bash
        run: |
          set -euo pipefail
          steps="$REQUESTED_STEPS"
          if [ -z "$steps" ]; then steps=2; fi
          python llm/models/run_pythia_14m_lora_inspectability.py \
            --steps "$steps" \
            --output-dir llm/models/runs/pythia-14m-lora-inspectability

      - name: Check the independent decomposition and tangent oracles
        run: python -m unittest tests/test_lora_learning_dynamics.py

      - name: Compare eight learning steps across training examples and layers
        run: python examples/autogenerated/lora-learning-dynamics/run.py --output llm/models/runs/pythia-14m-learning-dynamics --steps 8 --learning-rate 0.01

      - name: Upload complete tensor receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pythia-14m-lora-inspectability-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            llm/models/runs/pythia-14m-lora-inspectability/
            llm/models/runs/pythia-14m-learning-dynamics/
          if-no-files-found: error
