name: Sweep Pythia 14M deduped BME onset

on:
  push:
    branches:
      - pythia-14m-lora-inspectability
    paths:
      - .github/workflows/pythia-14m-bme-onset.yml
      - llm/models/run_pythia_bme_onset.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pythia-14m-bme-onset
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHIA_BME_MODEL: EleutherAI/pythia-14m-deduped
      PYTHIA_BME_OUTPUT: llm/models/runs/pythia-14m-deduped-bme-onset.md
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pythia-14m-lora-inspectability
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU inference stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check \
            transformers==4.44.2 huggingface_hub==0.24.7

      - name: Run the same BME checkpoint sweep used for 410M
        shell: bash
        run: |
          set -euo pipefail
          python llm/models/run_pythia_bme_onset.py

      - name: Upload sweep receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pythia-14m-bme-onset-${{ github.run_id }}-${{ github.run_attempt }}
          path: llm/models/runs/pythia-14m-deduped-bme-onset.md
          if-no-files-found: warn

      - name: Commit sweep receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gym pythia probe"
          git config user.email "gym-pythia-probe@users.noreply.github.com"
          git add llm/models/runs/pythia-14m-deduped-bme-onset.md
          git diff --cached --quiet && exit 0
          git commit -m "[pythia-14m] Record BME onset checkpoint sweep"
          git pull --rebase origin pythia-14m-lora-inspectability
          git push origin HEAD:pythia-14m-lora-inspectability
