name: Generate Pythia 14M BME continuations

on:
  push:
    branches:
      - pythia-14m-lora-inspectability
    paths:
      - .github/workflows/pythia-14m-bme-generation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHIA_BME_MODEL: EleutherAI/pythia-14m-deduped
      PYTHIA_BME_GENERATE_STEPS: "512,1000,143000"
      PYTHIA_BME_MAX_NEW_TOKENS: "96"
      PYTHIA_BME_GENERATION_OUTPUT: llm/models/runs/pythia-14m-deduped-bme-generations.md
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install CPU inference stack
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check \
            transformers==4.44.2 huggingface_hub==0.24.7

      - name: Generate raw continuations
        run: |
          set -euo pipefail
          python llm/models/run_pythia_bme_onset.py

      - name: Upload generation receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pythia-14m-bme-generations-${{ github.run_id }}-${{ github.run_attempt }}
          path: llm/models/runs/pythia-14m-deduped-bme-generations.md
          if-no-files-found: error

      - name: Commit readable receipt
        if: success()
        run: |
          set -euo pipefail
          git config user.name "gym pythia probe"
          git config user.email "gym-pythia-probe@users.noreply.github.com"
          git add llm/models/runs/pythia-14m-deduped-bme-generations.md
          git diff --cached --quiet && exit 0
          git commit -m "[pythia-14m] Record raw BME generations"
          git pull --rebase origin pythia-14m-lora-inspectability
          git push origin HEAD:pythia-14m-lora-inspectability
