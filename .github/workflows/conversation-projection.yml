name: Conversation projection training

on:
  push:
    branches: ['sun/conversation-training-20261007']
    paths: ['examples/autogenerated/conversation-projection/**', '.github/workflows/conversation-projection.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check out the checked Ithon dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dilapidated-shed/ithon
          ref: ea45fc09b0764fcf1e29577a3ac9647882b68146
          path: .ci/ithon
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Check arithmetic and train the synthetic numerical control
        shell: ${{ github.workspace }}/.ci/ithon/ithon ${{ github.workspace }}/examples/autogenerated/conversation-projection/ci.pi {0}
        env:
          ITHON_ENTRYPOINT: ${{ github.workspace }}/.ci/ithon/ithon
          ITHON_CHECK_RECEIPT: ithon-checks.jsonl
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          {"output": "conversation-projection-output"}
      - name: Retain trained control weights and timing receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: conversation-projection-control
          path: |
            conversation-projection-output/
            ithon-checks.jsonl
          retention-days: 7
          if-no-files-found: error
