name: Sweep Pythia BME onset

on:
  push:
    branches:
      - pythia
    paths:
      - .github/workflows/pythia-bme-onset.yml
      - llm/models/run_pythia_bme_onset.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pythia-bme-onset
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pythia

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU inference stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check \
            transformers==4.44.2 huggingface_hub==0.24.7

      - name: Sweep Pythia checkpoints
        shell: bash
        run: |
          set -euo pipefail
          PYTHIA_BME_STEPS=72000 python llm/models/run_pythia_bme_onset.py

      - name: Commit sweep receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gym pythia probe"
          git config user.email "gym-pythia-probe@users.noreply.github.com"
          git add llm/models/runs/pythia-410m-bme-onset.md
          if git diff --cached --quiet; then
            echo "Sweep receipt unchanged"
            exit 0
          fi
          git commit -m "[pythia] Record BME onset checkpoint sweep"
          git pull --rebase origin pythia
          git push origin HEAD:pythia
