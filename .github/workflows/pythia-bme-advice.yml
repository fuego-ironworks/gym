name: Pythia BME advice baseline

on:
  pull_request:
    branches: [pythia]
    paths:
      - llm/models/run_pythia_bme_advice.py
      - llm/models/run_pythia_bme_training_sweep.py
      - llm/models/run_pythia_14m_lora_inspectability.py
      - cases/blackball-bias/BB-PYTHIA-01/bme-advice/**
      - .github/workflows/pythia-bme-advice.yml

permissions:
  contents: read

jobs:
  cpu-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GYM_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.44.2 huggingface_hub==0.24.7
      - name: Fetch immutable model
        run: |
          mkdir "$RUNNER_TEMP/bme-model"
          for model_file in config.json tokenizer.json tokenizer_config.json special_tokens_map.json model.safetensors; do
            curl -fsSL --retry 3 --max-time 900 "https://huggingface.co/EleutherAI/pythia-410m-deduped/resolve/c66f7467608ffee8fca0d28cf1f46a7574b53cec/$model_file" -o "$RUNNER_TEMP/bme-model/$model_file"
          done
      - name: Record raw continuations and scores
        run: |
          python llm/models/run_pythia_bme_advice.py --model-dir "$RUNNER_TEMP/bme-model" --output-dir "$RUNNER_TEMP/bme-results/literal"
          python llm/models/run_pythia_bme_advice.py --model-dir "$RUNNER_TEMP/bme-model" --output-dir "$RUNNER_TEMP/bme-results/scores" --mode score
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bme-advice-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bme-results
          if-no-files-found: error
