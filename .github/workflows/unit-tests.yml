name: Gym unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Gym
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run standard-library test suite
        run: python3 -m unittest discover -s tests
